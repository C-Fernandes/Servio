<div class="modal-overlay" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">

        <div class="modal-header">
            <h2>Novo serviço</h2>
            <button class="close-btn" (click)="close()">
                <span class="mat-icon">close</span>
            </button>
        </div>

        <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label>Título *</label>
                <input type="text" formControlName="title"
                    placeholder="Ex: Landing Page em React" autofocus>
            </div>

            <div class="form-group">
                <label>Descrição *</label>
                <textarea formControlName="description" rows="3"
                    placeholder="Detalhes sobre o serviço..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Preço (R$) *</label>
                    <input type="number" formControlName="price"
                        placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Duração (min)</label>
                    <input type="number" formControlName="duration"
                        placeholder="60">
                </div>
            </div>

            <div class="form-group">
                <label>Categoria *</label>
                <select formControlName="category" class="select-arrow">
                    <option value disabled selected>Escolha</option>
                    <option value="1">Desenvolvimento</option>
                    <option value="2">Design & Criação</option>
                    <option value="3">Marketing Digital</option>
                </select>
            </div>

            <div class="form-group">
                <label>Imagem do serviço</label>
                <div class="drop-zone"
                    [class.drag-over]="isDragging"
                    (dragover)="onDragOver($event)"
                    (dragleave)="onDragLeave($event)"
                    (drop)="onDrop($event)"
                    (click)="fileInput.click()">

                    <input type="file" #fileInput
                        (change)="onFileSelected($event)" accept="image/*"
                        hidden>

                    @if (!previewUrl) {
                    <div class="upload-placeholder">
                        <span class="mat-icon">upload</span>
                        <p>Clique para enviar uma imagem (até 5MB)</p>
                    </div>
                    } @else {
                    <div class="image-preview">
                        <img [src]="previewUrl" alt="Preview da capa">
                        <button type="button" class="btn-remove"
                            (click)="removeImage($event)"
                            title="Remover imagem">
                            <span class="mat-icon">delete</span>
                        </button>
                    </div>
                    }
                </div>
            </div>

            <button type="submit" class="btn-submit"
                [disabled]="serviceForm.invalid">
                Salvar
            </button>

        </form>
    </div>
</div>
