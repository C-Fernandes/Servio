<header class="page-header">
    <div class="breadcrumb">
        <span class="mat-icon">side_navigation</span>
        <span class="breadcrumb-text">Painel</span>
    </div>
    <h1 class="page-title">Painel do prestador</h1>
    <p class="page-subtitle">Gerencie serviços, agenda e finanças</p>
</header>

            <span class="mat-icon">account_balance_wallet</span>
        </div>
        <div class="card-content">
            <p class="card-label">Ganhos líquidos</p>
            <h2 class="card-value">R$ 0,00</h2>
        </div>
    </div>

    <div class="card stats-card">
        <div class="card-icon gray">
            <span class="mat-icon">trending_up</span>
        </div>

            <p class="card-label">Taxas pagas (10%)</p>
            <h2 class="card-value">R$ 0,00</h2>
        </div>
    </div>

    <div class="card stats-card">
        <div class="card-icon blue">
            <span class="mat-icon">work_history</span>
        </div>
        <div class="card-content">
            <p class="card-label">Pedidos pendentes</p>
            <h2 class="card-value">0</h2>
        </div>
    </div>
</section>

<nav class="toggle-container">
