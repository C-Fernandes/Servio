<div class="notification-bell">
  <button
    type="button"
    class="bell-btn"
    [attr.aria-label]="'Notificações'"
    (click)="toggle()">
    <span class="mat-icon">notifications</span>
    @if (unreadCount() > 0) {
    <span class="bell-badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </button>

  @if (open()) {
  <div class="bell-backdrop" (click)="close()"></div>

  <div class="bell-panel">
    <div class="bell-panel-header">
      <span>Notificações</span>
      @if (notifications().length > 0) {
      <button type="button" class="mark-all" (click)="markAllRead()">
        Marcar todas como lidas
      </button>
      }
    </div>

    <div class="bell-panel-body">
      @if (loading()) {
      <p class="bell-status">Carregando...</p>
      } @else {
      @for (item of notifications(); track item.id) {
      <button
        type="button"
        class="bell-item"
        [class.unread]="!item.read"
        (click)="onItemClick(item)">
        <span class="bell-item-dot" [class.on]="!item.read"></span>
        <span class="bell-item-text">
          <span class="bell-item-msg">{{ item.message }}</span>
          <span class="bell-item-time">{{ item.createdAt | date:'dd/MM HH:mm' }}</span>
        </span>
      </button>
      } @empty {
      <p class="bell-status">Nenhuma notificação.</p>
      }
      }
    </div>
  </div>
  }
</div>
